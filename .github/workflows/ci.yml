# Builds and tests the package on every PR and on main. Public repo: runner minutes are
# free; the suite is offline (loopback only) by contract.
#
# The manifest is swift-tools-version 6.4, which ships with Xcode 27. `macos-26` tops out at
# Xcode 26.6, so the job runs on GitHub's separate `xcode-27` image (generally available
# 2026-10-15; default Xcode 27.0, 27A266a) on the image's own toolchain, as devin-kick does.
#
# The LibXray binary target is a 101 MB download. SwiftPM keeps the fetched zip in
# ~/Library/Caches/org.swift.swiftpm/artifacts (the extracted copy under .build/artifacts is
# what the build reads), so both are cached keyed on the manifest — the checksum lives in
# Package.swift, so hashing the file can't drift from the pin.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Artifact cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build/artifacts
          key: libxray-${{ hashFiles('Package.swift') }}
          restore-keys: libxray-

      - name: Build
        run: swift build

      - name: Test
        run: swift test
